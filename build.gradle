plugins {
    id 'java'
}
version = '1.0'
sourceSets.main.java.srcDirs = ["src"]
repositories {
    mavenCentral()
    maven { url 'https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository' }
    maven { url 'https://www.jitpack.io' }
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
ext {
    mindustryVersion = 'v146'
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}
dependencies {
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.register('jarAndroid') {
    dependsOn 'jar'
    doLast {
        if (!sdkRoot || !new File(sdkRoot).exists()) throw new GradleException("No valid Android SDK found.")
        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find { f -> new File(f, "android.jar").exists() }
        if (!platformRoot) throw new GradleException("No android.jar found.")
        def d8 = System.getProperty("os.name").toLowerCase().contains("windows") ? "d8.bat" : "d8"
        def buildTools = new File("$sdkRoot/build-tools/").listFiles().sort().reverse().find { f -> new File(f, d8).exists() }
        if (!buildTools) throw new GradleException("No d8 found.")
        def dependencies = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")]).collect { "--classpath $it.path" }.join(" ")
        "$buildTools/$d8 $dependencies --min-api 26 --output ${project.archivesBaseName}Android.jar ${project.archivesBaseName}Desktop.jar".execute(null, new File("$buildDir/libs")).waitForProcessOutput(System.out, System.err)
    }
}
jar {
    archiveFileName = "${project.archivesBaseName}Desktop.jar"
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from(rootDir) {
        include "mod.hjson"
        include "icon.png"
        include "bundles/**"
    }
}
tasks.register('deploy', Jar) {
    dependsOn 'jarAndroid'
    dependsOn 'jar'
    archiveFileName = "${project.archivesBaseName}.jar"
    from { [zipTree("$buildDir/libs/${project.archivesBaseName}Desktop.jar"), zipTree("$buildDir/libs/${project.archivesBaseName}Android.jar")] }
    doLast {
        delete {
            delete "$buildDir/libs/${project.archivesBaseName}Desktop.jar"
            delete "$buildDir/libs/${project.archivesBaseName}Android.jar"
        }
    }
}
