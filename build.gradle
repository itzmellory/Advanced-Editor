apply plugin: "java"

version '1.0'
sourceCompatibility = 8
targetCompatibility = 8

repositories {
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
}

dependencies {
    compileOnly "com.github.Anuken.Arc:arc-core:v160"
    compileOnly "com.github.Anuken.Mindustry:core:v160"
}

jar {
    archiveFileName = "${project.name}Desktop.jar"
}

task jarAndroid(type: Jar) {
    dependsOn jar
    archiveFileName = "${project.name}.jar"

    doLast {
        exec {
            commandLine "d8", "--min-api", "24", "--output", "${buildDir}/libs/${project.name}.jar", "${buildDir}/libs/${project.name}Desktop.jar"
        }
    }
}
