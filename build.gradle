plugins {
    id 'java'
}

version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenCentral()
    maven { url "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
    maven { url "https://www.jitpack.io" }
}

ext {
    mindustryVersion = 'v160'
}

dependencies {
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

jar {
    archiveFileName = "${project.name}Desktop.jar"
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from(rootDir) {
        include "mod.hjson"
        include "icon.png"
    }
    from("assets/") {
        include "**"
    }
}

task jarAndroid {
    dependsOn jar
    doLast {
        def sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
        if(!sdkRoot || !new File(sdkRoot).exists()) throw new GradleException("No valid Android SDK found.")

        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find { f -> new File(f, "android.jar").exists() }
        if(!platformRoot) throw new GradleException("No android.jar found.")

        def d8 = new File("$sdkRoot/build-tools/").listFiles().sort().reverse().find { f -> new File(f, "d8").exists() || new File(f, "d8.bat").exists() }
        def d8Exec = new File(d8, System.getProperty("os.name").toLowerCase().contains("windows") ? "d8.bat" : "d8").absolutePath

        def dependencies = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")]).collect { "--classpath $it.path" }.join(" ")

        def command = "$d8Exec $dependencies --min-api 14 --output ${project.name}Android.jar ${buildDir}/libs/${project.name}Desktop.jar"
        command.execute(null, new File("$buildDir/libs")).waitForProcessOutput(System.out, System.err)
    }
}

task deploy(type: Jar) {
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${project.name}.jar"

    from { [zipTree("$buildDir/libs/${project.name}Desktop.jar"), zipTree("$buildDir/libs/${project.name}Android.jar")] }

    doLast {
        delete {
            delete "$buildDir/libs/${project.name}Desktop.jar"
            delete "$buildDir/libs/${project.name}Android.jar"
        }
    }
}
