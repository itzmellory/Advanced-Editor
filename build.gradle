plugins {
    id 'java'
}

version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenCentral()
    maven { url "https://www.jitpack.io" }
}

dependencies {
    compileOnly "com.github.Anuken.Arc:arc-core:v160"
    compileOnly "com.github.Anuken.Mindustry:core:v160"
}

tasks.named("jar") {
    archiveFileName = "${project.name}Desktop.jar"
}

tasks.register("jarAndroid", Jar) {
    dependsOn tasks.named("jar")
    archiveFileName = "${project.name}.jar"
    
    def libsDir = layout.buildDirectory.dir("libs").get().asFile
    
    doLast {
        project.exec {
            commandLine "d8", "--min-api", "24", "--output", "${libsDir}/${project.name}.jar", "${libsDir}/${project.name}Desktop.jar"
        }
    }
}
